version: '3.9'

services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pkh_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_this_minio_secret}
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000' # object API (also used directly by the backend container)
      - '9001:9001' # web console, handy for inspecting stored files

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/personal_knowledge_hub
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - '5000'

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  mongo-data:
  minio-data:
