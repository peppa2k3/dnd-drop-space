name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: pkh-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run lint --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run test:themes --prefix frontend
      - run: npm run build --prefix frontend
      - run: bash scripts/test-deploy-flow.sh
      - run: node scripts/init-env.cjs
      - run: docker compose --env-file backend/.env config --quiet
      - run: docker compose --env-file backend/.env up -d --build --wait --wait-timeout 180
      - run: docker compose --env-file backend/.env exec -T backend npm run test:smoke
      - run: docker compose --env-file backend/.env exec -T backend npm run test:rbac
      - run: docker compose --env-file backend/.env exec -T backend npm run test:collaboration
      - run: docker compose --env-file backend/.env exec -T backend npm run test:auth
      - name: Failure logs
        if: failure()
        run: docker compose --env-file backend/.env logs --tail 80
      - name: Stop isolated CI stack
        if: always()
        run: docker compose --env-file backend/.env down --volumes
