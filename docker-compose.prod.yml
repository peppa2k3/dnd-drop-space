# Production owns application containers only. MongoDB 4.0 and MinIO are
# pre-existing services on PKH_STORAGE_NETWORK; neither is managed here.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${PKH_ENV_FILE:?Set private backend.env path}
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY_HOPS: 1
    networks:
      - web
      - storage
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.services.pkh-dnd-api.loadbalancer.server.port=5000
      - traefik.http.routers.pkh-dnd-api.rule=Host(`api.dangngochai.io.vn`)
      - traefik.http.routers.pkh-dnd-api.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:?Set existing HTTPS entrypoint}
      - traefik.http.routers.pkh-dnd-api.tls=true
      - traefik.http.routers.pkh-dnd-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set existing certificate resolver}
      - traefik.http.routers.pkh-dnd-api.service=pkh-dnd-api
      - traefik.http.routers.pkh-dnd-web-api.rule=Host(`dangngochai.io.vn`) && PathPrefix(`/api`)
      - traefik.http.routers.pkh-dnd-web-api.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:?Set existing HTTPS entrypoint}
      - traefik.http.routers.pkh-dnd-web-api.tls=true
      - traefik.http.routers.pkh-dnd-web-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set existing certificate resolver}
      - traefik.http.routers.pkh-dnd-web-api.priority=100
      - traefik.http.routers.pkh-dnd-web-api.service=pkh-dnd-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  nginx:
    image: ${WEB_IMAGE:?Set immutable WEB_IMAGE}
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 120s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.services.pkh-dnd-web.loadbalancer.server.port=80
      - traefik.http.routers.pkh-dnd-web.rule=Host(`dangngochai.io.vn`)
      - traefik.http.routers.pkh-dnd-web.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:?Set existing HTTPS entrypoint}
      - traefik.http.routers.pkh-dnd-web.tls=true
      - traefik.http.routers.pkh-dnd-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set existing certificate resolver}
      - traefik.http.routers.pkh-dnd-web.service=pkh-dnd-web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  web:
    external: true
    name: web
  storage:
    external: true
    name: ${PKH_STORAGE_NETWORK:?Set existing private storage network}
