log_format without_query '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log without_query;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be large (see backend MAX_FILE_SIZE_MB) - this must be >=
    # that limit or big uploads get rejected by Nginx before reaching the API.
    client_max_body_size 1100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy to the backend API. Long timeouts on purpose: large
    # file uploads and video streaming can legitimately take a while.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Never cache the app shell - PWA/service worker updates must always
    # be picked up on next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing (React Router) - always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
